<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/static/js/theme.js"></script>
    <title>Control - jamr.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,600..700&family=DM+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a href="/discover" class="brand">jamr<span>.io</span></a>
            <div class="topbar-actions">
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
                <div class="topbar-user" id="topbar-user" hidden>
                    <span class="avatar" id="topbar-avatar" aria-hidden="true"></span>
                    <a class="topbar-user-name" id="topbar-user-name" href="/account" title="Your account"></a>
                    <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Log out</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="page-head">
            <div>
                <h1>Control</h1>
                <p id="control-intro">Manage roles and suspensions.</p>
            </div>
        </section>

        <div class="control-toolbar">
            <input type="search" id="user-search" class="input" placeholder="Search people" aria-label="Search people">
            <span id="user-total" class="user-total"></span>
        </div>

        <ul id="user-list" class="user-list" aria-live="polite">
            <li class="loading">Loading people...</li>
        </ul>
    </main>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/admin.js"></script>
</body>
</html>
